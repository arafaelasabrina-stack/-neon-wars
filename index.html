<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Neon Wars</title><style>*{box-sizing:border-box}body{margin:0;background:#060a14;color:#fff;font:14px system-ui;text-align:center}.app{max-width:480px;margin:auto;padding:14px}h1{font-size:32px;margin:5px;text-shadow:0 0 20px #00dfff;font-style:italic}.sub{color:#45eaff;letter-spacing:4px;font-size:10px}canvas{width:100%;max-width:420px;aspect-ratio:1;background:#080e18;border:1px solid #25455c;border-radius:10px}.event{background:#142238;padding:12px;color:#a4f4ff;min-height:44px;border-radius:8px;margin:10px 0}.flags{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}button{background:#142238;color:white;border:1px solid #3b5871;border-radius:7px;padding:9px 2px;touch-action:manipulation}.actions{display:flex;gap:6px;margin-top:12px}.actions button{flex:1}.rank{display:flex;align-items:center;gap:6px;font-size:11px;margin:8px 0}.bar{flex:1;background:#1b2940;height:8px;border-radius:6px;overflow:hidden}.bar span{display:block;height:100%}.muted{color:#9baec4;font-size:11px}</style></head><body><main class="app"><div class="sub">WORLD DOMINATION</div><h1>NEON WARS</h1><p id="info" class="muted"></p><canvas id="map" width="360" height="360"></canvas><div class="event" id="event" aria-live="polite"></div><div id="rank"></div><p class="muted">TOQUE NA BANDEIRA PARA CONQUISTAR ATÉ 12 TERRITÓRIOS</p><div class="flags" id="flags"></div><div class="actions"><button id="pause">Pausar</button><button id="voice">🔇 Ativar voz</button><button id="reset">Nova partida</button></div><p id="audioStatus" class="muted">Teste a voz após abrir no Safari</p><button id="testVoice" style="width:100%">🎙️ Testar narração agora</button><p id="wins" class="muted"></p><p class="muted">Protótipo gratuito — não conectado ao chat do TikTok</p></main><script>
const teams=[['🇧🇷','Brasil','#00fa83'],['🇦🇷','Argentina','#42c9ff'],['🇵🇹','Portugal','#ff315f'],['🇲🇽','México','#00cbb0'],['🇺🇸','EUA','#5577ff'],['🇯🇵','Japão','#ff64c4'],['🇫🇷','França','#ab65ff'],['🇩🇪','Alemanha','#ffce28'],['🇪🇸','Espanha','#ff8a35'],['🇮🇹','Itália','#a3e83e'],['🇨🇱','Chile','#d53aff'],['🇨🇴','Colômbia','#e9eb70'],['🇬🇧','Reino Unido','#8d9cdd'],['🇨🇦','Canadá','#ff5136'],['🇺🇾','Uruguai','#26a1bb'],['🇰🇷','Coreia','#e6a2df']];const cv=document.getElementById('map'),c=cv.getContext('2d'),N=32,S=360/N;let board=[],wins=Array(16).fill(0),round=0,tick=0,wait=0,paused=false,flash=[],voiceOn=false,lastLeader=-1;const el=id=>document.getElementById(id);function counts(){let a=Array(16).fill(0);board.forEach(v=>a[v]++);return a}function neighbors(i){let x=i%N,y=Math.floor(i/N),a=[];if(x)a.push(i-1);if(x<N-1)a.push(i+1);if(y)a.push(i-N);if(y<N-1)a.push(i+N);return a}function speak(s){if(!voiceOn||!('speechSynthesis'in window))return;try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='pt-BR';u.rate=1.08;u.onstart=()=>el('audioStatus').textContent='🔊 Narrando';u.onerror=e=>el('audioStatus').textContent='Áudio indisponível: '+e.error;u.onend=()=>el('audioStatus').textContent='Narração finalizada';speechSynthesis.speak(u)}catch(e){el('audioStatus').textContent='Narração indisponível neste navegador'}}function message(s,announce=false){el('event').textContent=s;if(announce)speak(s)}function start(){round++;tick=0;wait=0;lastLeader=-1;flash=[];board=Array.from({length:1024},(_,i)=>Math.floor(Math.floor(i/N)/8)*4+Math.floor(i%N/8));message('⚔️ Uma nova batalha começou!',true);draw()}function capture(t,n){let total=0;for(let k=0;k<n;k++){let targets=new Set();for(let i=0;i<board.length;i++)if(board[i]===t)for(let j of neighbors(i))if(board[j]!==t)targets.add(j);let a=[...targets];if(!a.length)break;let j=a[Math.floor(Math.random()*a.length)];board[j]=t;flash.push({j,life:5});total++}return total}function draw(){let a=counts(),pos=teams.map(()=>[0,0]);c.fillStyle='#060c16';c.fillRect(0,0,360,360);board.forEach((v,i)=>{let x=i%N,y=Math.floor(i/N),px=x*S,py=y*S;pos[v][0]+=x;pos[v][1]+=y;c.fillStyle=teams[v][2]+'40';c.fillRect(px,py,S+.3,S+.3);c.strokeStyle=teams[v][2];c.shadowColor=teams[v][2];c.shadowBlur=5;c.lineWidth=1.1;c.beginPath();if(!x||board[i-1]!==v){c.moveTo(px,py);c.lineTo(px,py+S)}if(x===N-1||board[i+1]!==v){c.moveTo(px+S,py);c.lineTo(px+S,py+S)}if(!y||board[i-N]!==v){c.moveTo(px,py);c.lineTo(px+S,py)}if(y===N-1||board[i+N]!==v){c.moveTo(px,py+S);c.lineTo(px+S,py+S)}c.stroke();c.shadowBlur=0});flash.forEach(p=>{c.fillStyle='rgba(255,255,255,'+p.life/7+')';c.fillRect(p.j%N*S,Math.floor(p.j/N)*S,S,S)});a.forEach((n,i)=>{if(n>7){c.font=n>55?'26px sans-serif':'17px sans-serif';c.textAlign='center';c.shadowColor='#000';c.shadowBlur=6;c.fillText(teams[i][0],(pos[i][0]/n+.5)*S,(pos[i][1]/n+.5)*S+8);c.shadowBlur=0}el('t'+i).style.opacity=n?1:.35;el('s'+i).textContent=n+' territ.'});el('info').textContent='ROUND '+round+' • '+a.filter(Boolean).length+' NAÇÕES • '+(wait?'Próxima em '+Math.ceil((25-wait)/5)+'s':Math.floor(tick/5)+'s');el('rank').innerHTML=a.map((n,i)=>({n,i})).sort((a,b)=>b.n-a.n).slice(0,4).map(({n,i})=>'<div class="rank"><span style="width:110px;text-align:left">'+teams[i][0]+' '+teams[i][1]+'</span><div class="bar"><span style="width:'+(n/1024*100)+'%;background:'+teams[i][2]+'"></span></div><span>'+(n/1024*100).toFixed(1)+'%</span></div>').join('')}function finish(){if(wait)return;let a=counts(),m=Math.max(...a),leaders=a.map((v,i)=>v===m?i:-1).filter(i=>i>=0);wait=1;if(leaders.length===1){wins[leaders[0]]++;message('🏆 '+teams[leaders[0]][1]+' venceu a batalha!',true)}else message('⚔️ A batalha terminou empatada!',true);el('wins').textContent='🏆 '+teams.map((t,i)=>wins[i]?t[0]+' '+wins[i]:'').filter(Boolean).join('  ')}teams.forEach((t,i)=>{let b=document.createElement('button');b.id='t'+i;b.style.borderColor=t[2]+'88';b.innerHTML='<span style="font-size:24px">'+t[0]+'</span><br>'+t[1]+'<br><small id="s'+i+'" style="color:'+t[2]+'"></small>';b.onclick=()=>{if(wait||paused)return;if(!board.includes(i)){message(t[1]+' foi eliminado. Aguarde a próxima partida.');return}let n=capture(i,12);message('⚡ '+t[1]+' conquistou '+n+' territórios!',true);draw();if(counts()[i]===1024)finish()};el('flags').appendChild(b)});el('pause').onclick=()=>{paused=!paused;el('pause').textContent=paused?'Continuar':'Pausar'};el('reset').onclick=start;el('voice').onclick=()=>{voiceOn=!voiceOn;el('voice').textContent=voiceOn?'🔊 Voz ligada':'🔇 Ativar voz';if(voiceOn)speak('Bem vindos ao Neon Wars! Escolha seu país e prepare-se para a batalha!')};el('testVoice').onclick=()=>{voiceOn=true;el('voice').textContent='🔊 Voz ligada';el('audioStatus').textContent='Solicitando áudio...';speak('Atenção! O Brasil está avançando! Uma nova guerra das nações começou!')};start();setInterval(()=>{if(paused)return;if(wait){if(++wait>=25)start();else draw();return}tick++;flash=flash.filter(p=>--p.life>0);if(tick%2===0){let order=teams.map((_,i)=>i);for(let i=15;i>0;i--){let j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}order.forEach(i=>{if(board.includes(i))capture(i,1)})}let a=counts(),leader=a.indexOf(Math.max(...a));if(tick%50===0&&leader!==lastLeader){lastLeader=leader;message('🔥 '+teams[leader][1]+' assumiu a liderança!',true)}if(Math.max(...a)===1024||tick>=600)finish();draw()},200);
</script></body></html>
